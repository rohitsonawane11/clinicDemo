<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Consultation Entry</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#dae2ff",
                        "on-background": "#091c35",
                        "primary-fixed-dim": "#b2c5ff",
                        "primary-container": "#0052cc",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#b2c5ff",
                        "inverse-surface": "#20314b",
                        "tertiary-fixed-dim": "#65dca4",
                        "on-primary-fixed-variant": "#0040a2",
                        "secondary-container": "#dde0e2",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f9f9ff",
                        "tertiary-fixed": "#82f9be",
                        "surface-dim": "#cadbfc",
                        "inverse-on-surface": "#ecf0ff",
                        "outline": "#737685",
                        "on-secondary-fixed": "#181c1e",
                        "on-primary-fixed": "#001848",
                        "on-tertiary-container": "#72e9af",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#e7eeff",
                        "secondary-fixed": "#e0e3e5",
                        "on-secondary-container": "#5f6365",
                        "error": "#ba1a1a",
                        "surface-tint": "#0c56d0",
                        "primary": "#003d9b",
                        "secondary": "#5b5f61",
                        "on-tertiary-fixed": "#002113",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f0f3ff",
                        "tertiary-container": "#006844",
                        "on-surface": "#091c35",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#434749",
                        "on-tertiary-fixed-variant": "#005235",
                        "on-primary-container": "#c4d2ff",
                        "outline-variant": "#c3c6d6",
                        "surface-variant": "#d6e3ff",
                        "secondary-fixed-dim": "#c4c7c9",
                        "tertiary": "#004e32",
                        "surface-container-highest": "#d6e3ff",
                        "background": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#dfe8ff",
                        "surface-bright": "#f9f9ff",
                        "on-surface-variant": "#434654"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target": "48px",
                        "base": "4px",
                        "xl": "32px",
                        "sm": "12px",
                        "xs": "8px",
                        "lg": "24px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24 font-body-md">
<!-- TopAppBar -->
<header class="bg-surface text-primary border-b border-outline-variant flex justify-between items-center w-full px-md py-xs h-touch-target sticky top-0 z-40">
<div class="flex items-center gap-sm">
<button class="h-touch-target w-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div>
<h1 class="font-headline-md text-headline-md">Rajesh Patil</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant">Consultation Entry</p>
</div>
</div>
<div class="flex items-center gap-xs">
<button class="h-touch-target w-touch-target flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<main class="p-md max-w-3xl mx-auto space-y-lg mt-sm">
<!-- Vitals/Info Card (Optional context for consultation) -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md">
<div class="flex items-center justify-between mb-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Patient Overview</h2>
<span class="bg-tertiary-fixed text-on-tertiary-fixed-variant font-label-sm text-label-sm px-2 py-1 rounded-full">Checked In</span>
</div>
<div class="grid grid-cols-3 gap-sm">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Age</p>
<p class="font-body-md text-body-md font-medium">45 M</p>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Temp</p>
<p class="font-body-md text-body-md font-medium text-error">101.2°F</p>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">BP</p>
<p class="font-body-md text-body-md font-medium">120/80</p>
</div>
</div>
</section>
<!-- Symptoms Section -->
<section>
<h2 class="font-label-md text-label-md text-on-surface-variant mb-xs">Symptoms (Quick Select)</h2>
<div class="flex flex-wrap gap-xs">
<!-- Selected Chip Example -->
<button class="h-touch-target px-md rounded-full bg-primary-container text-on-primary-container border border-primary flex items-center gap-2 font-label-md text-label-md">
<span class="material-symbols-outlined text-sm" data-icon="check">check</span>
                    Fever
                </button>
<!-- Unselected Chips -->
<button class="h-touch-target px-md rounded-full bg-surface-container-lowest text-on-surface-variant border border-outline-variant hover:bg-surface-container-low transition-colors font-label-md text-label-md">
                    Cough
                </button>
<button class="h-touch-target px-md rounded-full bg-primary-container text-on-primary-container border border-primary flex items-center gap-2 font-label-md text-label-md">
<span class="material-symbols-outlined text-sm" data-icon="check">check</span>
                    Cold
                </button>
<button class="h-touch-target px-md rounded-full bg-surface-container-lowest text-on-surface-variant border border-outline-variant hover:bg-surface-container-low transition-colors font-label-md text-label-md">
                    Headache
                </button>
<button class="h-touch-target px-md rounded-full bg-surface-container-lowest text-on-surface-variant border border-outline-variant hover:bg-surface-container-low transition-colors font-label-md text-label-md">
                    Body pain
                </button>
<button class="h-touch-target w-touch-target rounded-full bg-surface-container-lowest text-primary border border-outline-variant hover:bg-surface-container-low transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</section>
<!-- Diagnosis Field -->
<section>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="diagnosis">Diagnosis</label>
<input class="w-full h-touch-target bg-surface-container-lowest border border-outline-variant rounded-lg px-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline" id="diagnosis" placeholder="Enter clinical diagnosis" type="text"/>
</section>
<!-- Prescription Section -->
<section class="space-y-sm">
<div class="flex justify-between items-end mb-xs">
<h2 class="font-label-md text-label-md text-on-surface-variant">Prescription</h2>
</div>
<!-- Existing Medicine Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md">
<div class="flex justify-between items-start mb-sm">
<div>
<h3 class="font-body-md text-body-md font-medium text-on-surface">Paracetamol 500mg</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">Tablet</p>
</div>
<button class="text-error hover:bg-error-container p-1 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<div class="grid grid-cols-3 gap-sm mt-sm border-t border-outline-variant pt-sm">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Dose</p>
<p class="font-body-md text-body-md">1-1-1 (After Food)</p>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Duration</p>
<p class="font-body-md text-body-md">3 Days</p>
</div>
</div>
</div>
<!-- Add Medicine Form Container -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-md">
<h3 class="font-label-md text-label-md text-primary mb-sm flex items-center gap-1">
<span class="material-symbols-outlined text-sm" data-icon="add_circle">add_circle</span>
                    Add Medicine
                </h3>
<div class="space-y-sm">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base">Medicine Name</label>
<input class="w-full h-[40px] bg-surface-container-lowest border border-outline-variant rounded px-sm font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" placeholder="e.g. Amoxicillin" type="text"/>
</div>
<div class="grid grid-cols-2 gap-sm">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base">Dose / Frequency</label>
<select class="w-full h-[40px] bg-surface-container-lowest border border-outline-variant rounded px-sm font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all text-on-surface">
<option>1-0-1</option>
<option>1-1-1</option>
<option>0-0-1</option>
<option>SOS</option>
</select>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base">Duration</label>
<div class="flex items-center gap-2">
<input class="w-16 h-[40px] bg-surface-container-lowest border border-outline-variant rounded px-sm font-body-md text-center focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" type="number" value="5"/>
<span class="font-body-md text-on-surface-variant">Days</span>
</div>
</div>
</div>
<button class="w-full h-[40px] mt-sm bg-transparent border border-primary text-primary font-label-md text-label-md rounded hover:bg-primary-container hover:text-on-primary-container transition-colors">
                        + Add to Prescription
                    </button>
</div>
</div>
</section>
<!-- Doctor Notes -->
<section>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="notes">Doctor Notes (Internal)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline resize-none" id="notes" placeholder="Add any private notes or observations here..." rows="3"></textarea>
</section>
<!-- Primary Action -->
<section class="pt-lg">
<button class="w-full h-touch-target bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-lg shadow-sm active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="save">save</span>
                Save Visit
            </button>
</section>
</main>
</body></html>
